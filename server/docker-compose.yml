services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - app_network

  kafka-init:
    image: apache/kafka:latest
    container_name: kafka_init
    depends_on:
      - kafka
    entrypoint: ["/app/create-topics.sh"]
    volumes:
      - ./create-topics.sh:/app/create-topics.sh:ro
    networks:
      - app_network

  gateway-service:
    build: ./gateway
    env_file:
      - ./gateway/.env
    depends_on:
      - kafka
    networks:
      - app_network
    restart:
      on-failure
    ports:
      - "8000:8000"
  user-service:
    build: ./services/user
    env_file:
      - ./services/user/.env
    depends_on:
      - kafka
    networks:
      - app_network
    restart:
      on-failure
  admin-service:
    build: ./services/admin
    env_file:
      - ./services/admin/.env
    depends_on:
      - kafka
    networks:
      - app_network
    restart:
      on-failure
  match-making-service:
    build: ./services/match-making
    env_file:
      - ./services/match-making/.env
    depends_on:
      - kafka
    networks:
      - app_network
    restart:
      on-failure
  game-service:
    build: ./services/game
    env_file:
      - ./services/game/.env
    depends_on:
      - kafka
    networks:
      - app_network
    restart:
      on-failure
  rating-service:
    build: ./services/rating
    env_file:
      - ./services/rating/.env
    depends_on:
      - kafka
    networks:
      - app_network
    restart:
      on-failure
  friends-service:
    build: ./services/friends
    env_file:
      - ./services/friends/.env
    depends_on:
      - kafka
    networks:
      - app_network
    restart:
      on-failure
  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "3000:8001"
    networks:
      - app_network
networks:
  app_network: 
    driver: bridge

    